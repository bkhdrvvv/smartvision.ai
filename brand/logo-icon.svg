<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SmartVision AI: an eye inside an AI detection frame -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132a63"/>
      <stop offset="1" stop-color="#070d22"/>
    </linearGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa8ff"/>
      <stop offset="1" stop-color="#3b6ff5"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#glow)"/>
  <!-- detection frame corners -->
  <g fill="none" stroke="url(#ln)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 168V128q0-32 32-32h40"/>
    <path d="M344 96h40q32 0 32 32v40"/>
    <path d="M416 344v40q0 32-32 32h-40"/>
    <path d="M168 416h-40q-32 0-32-32v-40"/>
  </g>
  <!-- eye -->
  <path d="M136 256Q256 120 376 256Q256 392 136 256Z" fill="#0a1430" stroke="#eaf2ff" stroke-width="22" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="50" fill="url(#iris)"/>
  <circle cx="256" cy="256" r="20" fill="#071026"/>
  <circle cx="273" cy="239" r="9" fill="#fff"/>
</svg>
