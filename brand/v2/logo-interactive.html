<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartVision AI logo</title>
<style>
  :root { --bg:#070a1c; --fg:#fff; --muted:#9fb0d8; }
  html,body { margin:0; height:100%; background:radial-gradient(1200px 700px at 50% 35%, #141b48 0%, var(--bg) 60%); color:var(--fg); font-family:"Segoe UI",Inter,Arial,sans-serif; }
  .wrap { min-height:100%; display:grid; place-items:center; text-align:center; padding:24px 16px; box-sizing:border-box; }
  svg.logo { width:min(360px,80vw); height:auto; cursor:pointer; filter:drop-shadow(0 20px 60px rgba(59,130,246,.35)); -webkit-tap-highlight-color:transparent; }
  .m { transition:transform .7s cubic-bezier(.2,.8,.2,1); transform:translateY(0); }
  .open .m { transform:translateY(-34px); }
  .snap .m { transition-duration:.12s; transform:translateY(16px); }
  .spin { transform-origin:256px 256px; animation:spin 22s linear infinite; }
  .scan { transform-origin:256px 256px; animation:spin 3.2s linear infinite; }
  .core { transform-origin:256px 256px; animation:pulse 2.4s ease-in-out infinite; }
  .open .core { animation-duration:1.2s; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:.95 } 50% { transform:scale(1.25); opacity:1 } }
  h1 { margin:26px 0 6px; font-size:clamp(30px,6vw,52px); letter-spacing:2px; font-weight:800; }
  h1 span { background:linear-gradient(90deg,#22d3ee,#8b5cf6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { margin:0; color:var(--muted); font-size:16px; }
  .hint { margin-top:18px; font-size:13px; opacity:.7; }
  .flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; }
  .flash.on { opacity:.18; transition:none; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <svg class="logo open" id="logo" viewBox="0 0 512 512" role="img" aria-label="SmartVision AI">
      <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#151b45"/><stop offset="1" stop-color="#070a1c"/></linearGradient>
        <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
        <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#a5f3fc"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
        <linearGradient id="sc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
        <clipPath id="lens"><circle cx="256" cy="256" r="150"/></clipPath>
        <path id="blade" d="M256 192L311.43 224L404.4 277.7A150 150 0 0 0 349 138.3Z"/>
      </defs>
      <rect width="512" height="512" rx="116" fill="url(#bg)"/>
      <circle cx="256" cy="256" r="150" fill="#04061a"/>
      <g class="spin">
        <g clip-path="url(#lens)" fill="url(#bl)" stroke="#0b0f26" stroke-width="7" stroke-linejoin="round">
          <g><g class="m"><use href="#blade"/></g></g>
          <g transform="rotate(60 256 256)" opacity=".92"><g class="m"><use href="#blade"/></g></g>
          <g transform="rotate(120 256 256)" opacity=".84"><g class="m"><use href="#blade"/></g></g>
          <g transform="rotate(180 256 256)" opacity=".76"><g class="m"><use href="#blade"/></g></g>
          <g transform="rotate(240 256 256)" opacity=".86"><g class="m"><use href="#blade"/></g></g>
          <g transform="rotate(300 256 256)" opacity=".95"><g class="m"><use href="#blade"/></g></g>
        </g>
      </g>
      <g class="scan"><path d="M256 92A164 164 0 0 1 420 256" fill="none" stroke="url(#sc)" stroke-width="6" stroke-linecap="round"/></g>
      <circle cx="256" cy="256" r="164" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="3"/>
      <g class="core"><circle cx="256" cy="256" r="46" fill="url(#core)"/><circle cx="256" cy="256" r="15" fill="#fff"/></g>
    </svg>
    <h1>SMARTVISION <span>AI</span></h1>
    <p>Maktab, uy va ferma uchun aqlli kuzatuv</p>
    <p class="hint">Sichqonchani logoga olib boring yoki bosing 📸</p>
  </div>
</div>
<div class="flash" id="flash"></div>
<script>
  // hover: the shutter closes a little (focus); click / tap: "photo" — snap shut, flash, open again
  const logo = document.getElementById("logo"), flash = document.getElementById("flash");
  logo.addEventListener("mouseenter", () => logo.classList.remove("open"));
  logo.addEventListener("mouseleave", () => logo.classList.add("open"));
  logo.addEventListener("click", () => {
    logo.classList.remove("open"); logo.classList.add("snap");
    flash.classList.add("on");
    setTimeout(() => { flash.classList.remove("on"); logo.classList.remove("snap"); logo.classList.add("open"); }, 160);
  });
</script>
</body>
</html>
